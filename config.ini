; =====================================================================
;  BetterASF launcher configuration
; =====================================================================
[asf]

; Full path to ArchiSteamFarm.exe.
; If ASF is embedded into the executable, this option is not required.
; If ASF is not embedded, leave it empty to search near the app or set a path.
; Example: asf_path = C:\ASF\ArchiSteamFarm.exe
asf_path =

; ASF IPC host and port.
ipc_host = 127.0.0.1
ipc_port = 1242

; Set this if ASF.json contains IPCPassword.
ipc_password =

; Start ASF together with BetterASF.
;   true  - BetterASF starts ArchiSteamFarm.exe.
;   false - ASF is expected to be started manually.
start_asf = true

; For one-file Windows builds: if BetterASF.exe is launched outside Program Files,
; copy it to Program Files\BetterASF, start the installed copy, then remove the original file.
self_install_to_program_files = true

; Create per-user Desktop and Start Menu shortcuts when running a frozen exe.
create_shortcuts = true

; Window title and size.
window_title = BetterASF
window_width = 1180
window_height = 780

; Seconds to watch ASF startup/IPC. ASF self-update may take longer than a normal launch.
startup_timeout = 180

; Initial theme: dark or light. The last UI-selected theme has priority.
theme = dark

; Custom frameless window titlebar.
;   true  - custom titlebar.
;   false - standard system frame.
frameless = true

; Local UI server port. 0 = choose a free port automatically.
ui_port = 0

; UI mode:
;   browser - open current HTML UI in external Edge/Chrome App Mode.
;   webview - embedded pywebview/WebView2 mode.
ui_mode = webview

; Optional full path to msedge.exe/chrome.exe if auto-detection fails.
browser_path =

; Experimental WebView2 memory reduction mode.
; If a gray window appears, first set webview_aggressive=false, then webview_low_memory=false.
webview_low_memory = true

; More aggressively disable Chromium isolation and extra services.
webview_aggressive = true

; Try to run the renderer inside one WebView2 browser process.
; New Edge Runtime may partially ignore --single-process, but the flag is passed.
webview_single_process = true

; Disable GPU. Saves more GPU memory, but can cause a gray window on some systems.
webview_disable_gpu = false

; Try to remove the separate GPU process while keeping GPU inside the main WebView2 process.
webview_in_process_gpu = false

; Trim BetterASF/WebView2 working set every N seconds.
memory_trim = true
memory_trim_interval = 30

; Include msedgewebview2.exe even when WebView2 Runtime does not expose it as a Python child process.
; This makes the UI memory number closer to Task Manager.
memory_include_orphan_webview2 = true

; Extra Chromium/WebView2 arguments separated by spaces.
; Example: webview_extra_args = --disable-site-isolation-trials
webview_extra_args =
