; =====================================================================
;  ASF Desktop — конфигурация лаунчера
; =====================================================================
[asf]

; Полный путь к ArchiSteamFarm.exe.
; Если ASF вшит в .exe — этот параметр не нужен (ASF распакуется в ASF-runtime\).
; Если ASF НЕ вшит — оставьте пустым (ищется рядом) или укажите путь.
; Пример: asf_path = C:\ASF\ArchiSteamFarm.exe
asf_path =

; Адрес и порт IPC-интерфейса ASF (по умолчанию 127.0.0.1:1242).
ipc_host = 127.0.0.1
ipc_port = 1242

; Если в ASF.json задан IPCPassword — впишите его сюда (иначе оставьте пустым).
ipc_password =

; Запускать ли сам ASF из лаунчера.
;   true  — лаунчер сам стартует ArchiSteamFarm.exe (рекомендуется);
;   false — ASF вы запускаете отдельно, лаунчер только показывает интерфейс.
start_asf = true

; Заголовок и размер окна.
window_title = BetterASF
window_width = 1180
window_height = 780

; Сколько секунд ждать поднятия IPC перед открытием окна.
startup_timeout = 60

; Стартовая тема: dark или light. (Последний выбор пользователя сохраняется
; в settings.json и имеет приоритет над этим значением.)
theme = dark

; Кастомная безрамочная рамка окна (своя титульная полоса вместо системной):
;   true  — бесшовное окно без стандартного заголовка Windows (рекомендуется);
;   false — обычное окно с системной рамкой.
frameless = true

; Порт локального сервера интерфейса (0 = выбрать свободный автоматически).
ui_port = 0
